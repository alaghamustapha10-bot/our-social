name: LOLZ Capgo Live Updates

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "capacitor.config.json"
      - ".github/workflows/capgo-live-update.yml"

permissions:
  contents: read

concurrency:
  group: capgo-live-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-production-bundle:
    name: Build and publish OTA update to Capgo Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Register LOLZ app and production channel in Capgo
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CAPGO_TOKEN."
            exit 1
          fi

          if ! npx @capgo/cli@latest app list --apikey "$CAPGO_TOKEN" | grep -Fq "com.oursocial.app"; then
            npx @capgo/cli@latest app add com.oursocial.app --name "LOLZ" --apikey "$CAPGO_TOKEN"
          fi

          if ! npx @capgo/cli@latest channel list com.oursocial.app --apikey "$CAPGO_TOKEN" | grep -Eiq '(^|[^[:alnum:]_])production([^[:alnum:]_]|$)'; then
            npx @capgo/cli@latest channel add production com.oursocial.app --apikey "$CAPGO_TOKEN"
          fi

          npx @capgo/cli@latest channel set production com.oursocial.app \
            --state default --android --prod --device --apikey "$CAPGO_TOKEN"

      - name: Upload bundle to Capgo Production
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          npx @capgo/cli@latest bundle upload \
            --apikey "$CAPGO_TOKEN" \
            --channel=production \
            --auto-bump patch \
            --delta
