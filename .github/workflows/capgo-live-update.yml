name: LOLZ Capgo Live Updates

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "capacitor.config.json"
      - ".github/workflows/capgo-live-update.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capgo-live-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-production-bundle:
    name: Build and publish OTA update to Capgo Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Verify existing LOLZ Capgo app configuration
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            const appId = config.plugins?.CapacitorUpdater?.appId;
            if (appId !== "com.oursocial.app") {
              console.error("Capgo updater appId must be com.oursocial.app; found:", appId || "missing");
              process.exit(1);
            }
            console.log("Using existing Capgo app:", appId);
          '

      - name: Diagnose Capgo organization and app access
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          echo "Accessible Capgo organizations for the configured CI key:"
          npx @capgo/cli@latest organization list --apikey "$CAPGO_TOKEN"
          echo "Capgo apps visible to the configured CI key:"
          npx @capgo/cli@latest app list --show-org --show-org-id --apikey "$CAPGO_TOKEN"

      - name: Upload bundle to Capgo Production
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          npx @capgo/cli@latest bundle upload \
            --apikey "$CAPGO_TOKEN" \
            --channel=production \
            --auto-bump patch \
            --delta
