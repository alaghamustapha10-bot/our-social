name: Deploy LOLZ Group and Channel Calls

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/livekit-token/index.ts"
      - ".github/workflows/deploy-lolz-livekit-calls.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lolz-livekit-calls-production
  cancel-in-progress: false

jobs:
  deploy-livekit-calls:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy LOLZ LiveKit calls Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "edxwpivsuximriwdvzeq" || { echo "::error::SUPABASE_PROJECT_ID does not match the LOLZ project"; exit 1; }
          supabase functions deploy livekit-token --remote="$SUPABASE_PROJECT_ID" --yes
