name: Deploy LOLZ Push Notifications

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to apply the push migration and deploy lolz-push"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-push:
    if: ${{ github.ref == 'refs/heads/feature/lolz-stories-security-premium' && inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/lolz-stories-security-premium

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply LOLZ push database migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL secret"; exit 1; }
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261126140000_lolz_push_notifications.sql

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy only the LOLZ push Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "edxwpivsuximriwdvzeq" || { echo "SUPABASE_PROJECT_ID does not match the LOLZ project"; exit 1; }
          supabase functions deploy lolz-push --project-ref "$SUPABASE_PROJECT_ID"
