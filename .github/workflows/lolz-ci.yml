name: LOLZ CI

on:
  push:
    branches:
      - feature/lolz-stories-security-premium
      - feature/lolz-community-suite
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Run ESLint
        run: npm run lint

  edge-function-check:
    name: PayPal Edge Function type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check PayPal Edge Function
        working-directory: supabase/functions
        run: deno check paypal-subscription/index.ts
      - name: Check LOLZ Push Edge Function
        working-directory: supabase/functions
        run: deno check lolz-push/index.ts
      - name: Check LOLZ Admin Edge Function
        working-directory: supabase/functions
        run: deno check lolz-admin/index.ts
      - name: Check LOLZ moderation Edge Function
        working-directory: supabase/functions
        run: deno check lolz-moderate/index.ts
      - name: Check LOLZ LiveKit Calls Edge Function
        working-directory: supabase/functions
        run: deno check livekit-token/index.ts
      - name: Check LOLZ voice transcription Edge Function
        working-directory: supabase/functions
        run: deno check lolz-transcribe/index.ts

      - name: Check LOLZ commerce Edge Function
        working-directory: supabase/functions
        run: deno check lolz-commerce/index.ts

      - name: Validate LOLZ monetization migration structure
        run: |
          python - <<'PY'
          from pathlib import Path
          sql = Path("supabase/migrations/20261127124700_lolz_monetization_marketplace.sql").read_text()
          assert sql.count("as $") == 5, "Expected four dollar-quoted function bodies"
          assert sql.count("\n$;") == 5, "Expected four matching function terminators"
          assert sql.index("create table if not exists public.lolz_commerce_offers") < sql.index("create trigger lolz_guard_offer_review_trigger")
          assert sql.index("create table if not exists public.lolz_sponsorship_briefs") < sql.index("create trigger lolz_guard_brief_review_trigger")
          assert "LOLZ admins read payout requests" in sql
          assert "pg_advisory_xact_lock" in sql
          print("LOLZ monetization migration structure OK")
          PY
